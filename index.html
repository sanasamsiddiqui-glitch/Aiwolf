<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>AI Wolf</title>
<style>
body{margin:0;background:#0b0f17;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;height:100vh}
header{background:#131926;padding:12px 16px;font-weight:bold;font-size:18px;color:#38bdf8;border-bottom:1px solid #263147;display:flex;justify-content:space-between;align-items:center}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.u{align-self:flex-end;background:#2563eb;padding:10px 14px;border-radius:14px;max-width:85%}
.a{background:#131926;border:1px solid #263147;padding:14px;border-radius:14px;line-height:1.6;white-space:pre-wrap}
.bar{background:#131926;padding:10px 12px 26px;border-top:1px solid #263147;display:flex;flex-direction:column;gap:8px}
input{width:100%;padding:12px;border-radius:20px;border:1px solid #334155;background:#1c2436;color:#fff;font-size:15px;box-sizing:border-box}
button{width:100%;padding:12px;border-radius:20px;border:none;background:#2563eb;color:#fff;font-size:16px;font-weight:bold}
</style>
</head>
<body>
<header><span>🐺 AI Wolf</span><span style="font-size:12px;color:#38bdf8">Pro v3.0</span></header>
<div id="chat"><div class="a">AI Wolf Pro Overview:

Namaste! Ab main duniya ke kisi bhi vishay, vyakti, shahar, itihas, vigyan, rajniti (CM/Deputy CM/PM), cricket, bollywood aur ganit ka jawab de sakta hoon. Kuch bhi puchein!</div></div>
<div class="bar">
<input id="q" placeholder="Koi bhi sawal puchein..." onkeydown="if(event.keyCode===13)go()">
<button onclick="go()">Ask AI Wolf</button>
</div>
<script>
var DB=[
{k:["deputy cm","deputy chief minister","upmukhyamantri","up mukhyamantri","keshav prasad","brajesh pathak"],v:"Uttar Pradesh ke Deputy CM:\nUttar Pradesh mein do Up-Mukhyamantri (Deputy CM) hain:\n1. Shri Keshav Prasad Maurya\n2. Shri Brajesh Pathak"},
{k:["sabse jyada shatak","sabse zyada shatak","most centuries","sachin tendulkar","100 shatak"],v:"Cricket Record:\nAntarrashtriya cricket mein sabse zyada 100 shatak (centuries) Sachin Tendulkar ke naam hain. Virat Kohli dusre sthan par hain."},
{k:["pradhanmantri","prime minister","bharat ke pm","india ke pm","narendra modi"],v:"Bharat ke Pradhanmantri:\nShri Narendra Modi Bharat ke vartaman Pradhanmantri hain."},
{k:["rashtrapati","president of india","bharat ke president","droupadi murmu"],v:"Bharat ki Rashtrapati:\nSmt. Droupadi Murmu Bharat ki Rashtrapati hain."},
{k:["up ke cm","uttar pradesh ke cm","mukhyamantri kaun","yogi adityanath"],v:"Uttar Pradesh ke Mukhyamantri:\nUttar Pradesh ki rajdhani Lucknow hai aur iske Mukhyamantri Shri Yogi Adityanath hain."},
{k:["rajdhani","capital of india","bharat ki capital"],v:"Bharat ki Rajdhani:\nNayi Delhi (New Delhi) Bharat ki rashtriya rajdhani hai."},
{k:["lucknow","nawab"],v:"Lucknow Jankari:\nLucknow Uttar Pradesh ki rajdhani hai, jise 'Nawabo ka Shahar' kaha jata hai."},
{k:["tum kaun ho","who are you","ai wolf kya hai","apna parichay"],v:"AI Wolf Parichay:\nMain AI Wolf hoon, ek smart digital assistant jo samanya gyan, ganit aur live Wikipedia database se aapke har sawal ka jawab deta hoon."}
];
function addMsg(cls,txt){
var c=document.getElementById("chat"),d=document.createElement("div");
d.className=cls;d.innerText=txt;c.appendChild(d);c.scrollTop=c.scrollHeight;return d;
}
function askWiki(lang,query){
var url="https://"+lang+".wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(query)+"&gsrlimit=1&prop=extracts&exintro=1&explaintext=1&format=json&origin=*";
return fetch(url,{headers:{"Api-User-Agent":"AIWolfApp/3.0"}})
.then(function(r){return r.json();})
.then(function(d){
if(d&&d.query&&d.query.pages){
var keys=Object.keys(d.query.pages);
if(keys.length>0){
var page=d.query.pages[keys.slice(0,1).pop()];
if(page&&page.extract){return {title:page.title,extract:page.extract};}
}
}
return null;
});
}
function go(){
var q=document.getElementById("q"),t=q.value.trim();
if(!t)return;
addMsg("u",t);q.value="";
var low=t.toLowerCase(),ans="";
if(/^[0-9+\-*/().\s]+$/.test(t)&&/[+\-*/]/.test(t)){
try{ans="Ganit (Math) Uttar:\n"+t+" = "+Function("return ("+t+")")();}catch(e){}
}
if(!ans&&(low.indexOf("time")!==-1||low.indexOf("samay")!==-1||low.indexOf("baje")!==-1||low.indexOf("date")!==-1||low.indexOf("tarikh")!==-1||(low.indexOf("aaj")!==-1&&low.indexOf("din")!==-1))){
ans="Vartaman Tarikh aur Samay:\n"+new Date().toLocaleString("en-IN");
}
if(!ans){
DB.forEach(function(item){
if(!ans){
item.k.forEach(function(kw){
if(!ans&&low.indexOf(kw)!==-1){ans=item.v;}
});
}
});
}
if(ans){addMsg("a",ans);return;}
var box=addMsg("a","AI Wolf khoj raha hai...");
var isHindi=/[\u0900-\u097F]/.test(t);
var clean=t.replace(/kaun hai|kaun hain|kya hai|kya hota hai|kahan hai|ke baare mein|batao|who is|what is|where is|tell me about|कौन है|क्या है|कहाँ है|के बारे में|बताओ|\?/gi,"").trim()||t;
var primaryLang=isHindi?"hi":"en";
var secondaryLang=isHindi?"en":"hi";
askWiki(primaryLang,clean).then(function(s){
if(s&&s.extract){box.innerText=s.title+" (AI Wolf):\n\n"+s.extract;return;}
return askWiki(secondaryLang,clean).then(function(s2){
if(s2&&s2.extract){box.innerText=s2.title+" (AI Wolf):\n\n"+s2.extract;}
else{box.innerText="AI Wolf Overview:\nIs vishay par spasht jankari nahi mili. Kripya mukhya naam (jaise: 'Taj Mahal', 'ISRO', 'Shah Rukh Khan', 'Mahatma Gandhi') likhkar puchein!";}
});
}).catch(function(){
box.innerText="AI Wolf Overview:\nInternet connection slow hai ya is vishay par jankari uplabdh nahi hai.";
});
}
</script>
</body>
</html>
